<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Mesa Chica</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

    .login-wrap {
      width: 100%;
      max-width: 420px;
      padding: 1.5rem;
      animation: fadeIn 0.5s ease;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .login-logo h1 {
      font-size: 2.4rem;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .login-logo p {
      font-size: 0.9rem;
      color: var(--cream-muted);
    }

    .login-ornament {
      display: block;
      margin: 0 auto 1.25rem;
      width: 32px;
      height: 1px;
      background: var(--gold-muted);
    }

    .login-card {
      background: var(--bg-surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 2rem;
    }

    .login-card h2 {
      font-size: 1.1rem;
      font-family: var(--font-body);
      font-weight: 500;
      color: var(--cream);
      margin-bottom: 4px;
    }

    .login-card > p {
      font-size: 0.88rem;
      margin-bottom: 1.5rem;
    }

    .btn-login {
      width: 100%;
      justify-content: center;
      padding: 12px;
      font-size: 0.95rem;
      border-radius: var(--radius-md);
      margin-top: 0.5rem;
    }

    .login-note {
      text-align: center;
      font-size: 0.82rem;
      color: var(--cream-muted);
      margin-top: 1rem;
    }

    .error-msg {
      font-size: 0.85rem;
      color: #f5b8a8;
      margin-top: 8px;
      display: none;
    }

    .error-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <h1>La Mesa Chica</h1>
      <span class="login-ornament"></span>
      <p>El jurado gastronómico más exigente del barrio</p>
    </div>

    <div class="login-card">
      <h2>Ingresar al grupo</h2>
      <p>Usá tu email y la contraseña que te dieron.</p>

      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input
          type="email"
          id="email"
          class="form-input"
          placeholder="tu@email.com"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          class="form-input"
          placeholder="••••••"
          autocomplete="current-password"
        />
        <span class="error-msg" id="errorMsg"></span>
      </div>

      <button class="btn btn-primary btn-login" id="loginBtn" onclick="login()">
        Entrar
      </button>

      <p class="login-note">Si olvidaste tu contraseña, pedile al admin que te la resetee.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    const client = initSupabase()

    // Si ya hay sesión activa, redirigir al home
    async function checkExistingSession() {
      const { data: { session } } = await client.auth.getSession()
      if (session) window.location.href = '/home.html'
    }
    checkExistingSession()

    async function login() {
      const email = document.getElementById('email').value.trim().toLowerCase()
      const password = document.getElementById('password').value
      const btn = document.getElementById('loginBtn')
      const errorMsg = document.getElementById('errorMsg')

      errorMsg.classList.remove('show')

      if (!email || !email.includes('@')) {
        errorMsg.textContent = 'Ingresá un email válido.'
        errorMsg.classList.add('show')
        return
      }

      if (!password) {
        errorMsg.textContent = 'Ingresá tu contraseña.'
        errorMsg.classList.add('show')
        return
      }

      btn.textContent = 'Entrando...'
      btn.disabled = true

      const { error } = await client.auth.signInWithPassword({
        email,
        password
      })

      if (error) {
        errorMsg.textContent = 'Email o contraseña incorrectos.'
        errorMsg.classList.add('show')
        btn.textContent = 'Entrar'
        btn.disabled = false
        return
      }

      window.location.href = '/home.html'
    }

    // Enter para enviar
    document.getElementById('email').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('password').focus()
    })
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') login()
    })
  </script>
</body>
</html>
